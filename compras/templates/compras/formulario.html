{% load static %}
<!DOCTYPE html>
<html lang="es">

<head> 
<meta charset="UTF-8">
<link rel="stylesheet" href="{% static 'compras/styles.css' %}"> <!-- Esta linea conecta mi archivo css con el html para mostrarlo-->
<title> Proveedor de Insumos 'CB131' </title>

</head>

<body>

<div class="contenedor-uno">   <!-- Divide en un contenedor el apartado de empresa/producto/cantidad-->

<form method="POST"> <!-- Formulario -->
    {% csrf_token %}
    {% if messages %} <!-- Condición en caso de superar el stock al comprar-->
        {% for message in messages %}
            <p style="color: red;">{{ message }}</p>    
        {% endfor %}
    {% endif %}
    
    <label>Empresa:</label>  <!-- Etiquetas de llenado de datos -->
    <input type="text" name="empresa" required>
    <br>
    <label>Producto:</label>
    <select name="producto" id="select-producto">
        {% for p in productos %}

            <option value="{{ p.id }}" data-imagen="{% static 'compras/img/' %}{{ p.imagen }}">    
                {{ p.nombre }} (${{ p.precio }})
            </option>

        {% endfor %}
    </select>
    <br>
    <label>Cantidad:</label>
    <input type="number" name="cantidad" min="1" required>

    <button type="submit">Comprar</button>
</form>

    <div class="imgs">

<img id="vista-imagen" src="" alt="Vista previa del producto">
    </div>
</div>

<script> //Script para actualizar las imagenes dependiendo del producto seleccionado
        const select = document.getElementById('select-producto');  
        const img = document.getElementById('vista-imagen');

        function actualizarImagen() {
            const opcion = select.options[select.selectedIndex];
            if (!opcion) return;

            const rutaFoto = opcion.getAttribute('data-imagen');                
            img.src = rutaFoto;
        }

        select.addEventListener('change', actualizarImagen);
        actualizarImagen();
    </script>


</body>

</html>
