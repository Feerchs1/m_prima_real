<h2>¡Compra Exitosa! Aquí está tu Ticket</h2>
<p><strong>Empresa:</strong> {{ empresa }}</p>
<p><strong>Producto:</strong> {{ producto_nombre }}</p>
<p><strong>Cantidad:</strong> {{ cantidad }}</p>
<p><strong>Total a Pagar:</strong> ${{ total }}</p>

<form id="formspree-form" action="https://formspree.io/f/xkjjevzj" method="POST">
    <input type="hidden" name="Empresa" value="{{ empresa }}">
    <input type="hidden" name="Producto" value="{{ producto_nombre }}">
    <input type="hidden" name="Cantidad" value="{{ cantidad }}">
    <input type="hidden" name="Total" value="{{ total }}">
</form>

<script>
    // Descomenta la línea de abajo si quieres que se envíe solo sin dar clic al botón:
    document.getElementById('formspree-form').submit();
</script>
